name: Duster CLOUD-T1R3 source gate
on:
  push:
    branches:
      - tmp-duster-cloud-t1r3-20261005
permissions:
  contents: read
jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Checkout exact upstream
        uses: actions/checkout@v4
        with:
          repository: parhipov/OBDScanner
          ref: f8668a5832e10e2dd5024c6b48bc4d5709b3eecc
          path: source
          fetch-depth: 1
      - name: Apply known-fixes patch
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C source rev-parse HEAD)" = "f8668a5832e10e2dd5024c6b48bc4d5709b3eecc"
          base64 -d ci/duster-cloud-t1r3.patch.gz.b64 | gzip -dc > known.patch
          git -C source apply --check ../known.patch
          git -C source apply ../known.patch
          git -C source diff --check
          grep -q 'versionName = "2.2.0-cloud-t1r3"' source/app/build.gradle.kts
          ! grep -RIn 'obd\.elm\.send' source/app/src/main/java
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Unit tests and lint only
        shell: bash
        working-directory: source
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew testDebugUnitTest lintDebug --no-daemon --stacktrace
      - name: Collect evidence
        if: always()
        shell: bash
        run: |
          mkdir -p out
          cp -a source/app/build/reports/tests out/tests 2>/dev/null || true
          cp source/app/build/reports/lint-results-debug.txt out/ 2>/dev/null || true
          cp source/app/build/reports/lint-results-debug.html out/ 2>/dev/null || true
          sha256sum known.patch > out/PATCH-SHA256.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: DusterOBD-CLOUD-T1R3-source-gate
          path: out
          retention-days: 2
